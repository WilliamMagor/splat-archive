<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAGOR // SPATIAL ARCHIVE</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body>
<!-- EDIT BRAND NAME HERE -->
<nav><div id="brand">MAGOR // SPATIAL ARCHIVE</div><div class="mono" id="clock">SYS ONLINE</div></nav>
<section class="hero"><div class="mono">// MISSION LOG — CONSTRUCTION CAPTURE PROGRAM</div>
<h1>Built Sites,<br>Captured in 3D</h1>
<p>Gaussian splat records of construction projects by William Magor. Select a capture to begin.</p>
<a class="btn" href="#archive">Enter Archive</a></section>
<div class="section-h" id="archive"><h2>Archive</h2><span class="mono" id="count" style="font-size:.7rem;color:#8a8a8a"></span></div>
<main id="grid"></main>
<footer class="mono"><span>© William Magor</span><span>MAGOR // SPATIAL ARCHIVE</span></footer>
<script>
const clk=document.getElementById('clock');setInterval(()=>clk.textContent='UTC '+new Date().toISOString().slice(11,19),1000);
fetch('scenes.json').then(r=>r.json()).then(list=>{
  const g=document.getElementById('grid');
  document.getElementById('count').textContent=String(list.length).padStart(3,'0')+' RECORDS';
  for(const s of list){
    const a=document.createElement('a');a.className='card';a.href='viewer.html?id='+encodeURIComponent(s.id);
    const box=document.createElement('div');box.className='img';
    const img=document.createElement('img');img.loading='lazy';img.alt=s.title;img.src=s.thumbnail||'';box.append(img);
    const info=document.createElement('div');info.className='info';
    const h=document.createElement('h3');h.textContent=s.title;
    const dl=document.createElement('dl');dl.className='mono';
    for(const [k,v] of [['LOC',s.location],['DATE',s.date],['SCENE ID',s.id]]){const dt=document.createElement('dt');dt.textContent=k;const dd=document.createElement('dd');dd.textContent=v||'—';dl.append(dt,dd);}
    const go=document.createElement('div');go.className='go mono';go.textContent='Launch viewer →';
    info.append(h,dl,go);a.append(box,info);g.append(a);
  }
}).catch(e=>{document.getElementById('grid').textContent='Could not load scenes.json: '+e});
</script></body></html>
